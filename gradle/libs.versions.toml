vico = "2.0.2"

kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"

accompanistPermissions = "0.36.0"
coil = "2.7.0"
exifinterface = "1.3.7"

junit = "4.13.2"
