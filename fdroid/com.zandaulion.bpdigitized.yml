# Draft for an F-Droid inclusion request: copy to metadata/ in fdroiddata.
# This file is not used by the app's own build.
#
# AntiFeatures: Health Connect sync is optional. On Android 14+ Health Connect
# is part of the system; on Android 13 and below it needs Google's proprietary
# Health Connect app. NonFreeDep can be removed if reviewers agree it's not needed.
#
# License: fdroiddata accepts one SPDX id. The app code is GPL-3.0-or-later and the
# bundled Hearth models and ports are AGPL-3.0-only, so the combined app is AGPL.
#
# prebuild: gradle-daemon-jvm.properties asks Gradle for a JetBrains JDK 21, and
# the foojay resolver plugin in settings.gradle.kts can download one. The scanner
# flags that plugin, so both are removed and the build server's own JDK is used.
AntiFeatures:
  NonFreeDep:
    en-US: Optional Health Connect sync needs Google's proprietary Health Connect
      app on Android 13 and below.
Categories:
  - Sports & Health
License: AGPL-3.0-only
AuthorName: Zandaulion
SourceCode: https://github.com/zandaulion/BloodPressureMonitor
IssueTracker: https://github.com/zandaulion/BloodPressureMonitor/issues
Changelog: https://github.com/zandaulion/BloodPressureMonitor/blob/HEAD/docs/Release_Notes.md

AutoName: BP Digitizer

RepoType: git
Repo: https://github.com/zandaulion/BloodPressureMonitor.git

Builds:
  - versionName: 1.6.2
    versionCode: 29
    commit: v1.6.2
    subdir: app
    gradle:
      - yes
    prebuild:
      - rm ../gradle/gradle-daemon-jvm.properties
      - sed -i -e '/foojay-resolver/d' ../settings.gradle.kts

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.6.2
CurrentVersionCode: 29
