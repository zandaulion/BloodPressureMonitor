# Weekly maintenance PRs; review changes and CI before merging.
# Minor/patch updates are grouped; major upgrades have separate PRs.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    routine-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
